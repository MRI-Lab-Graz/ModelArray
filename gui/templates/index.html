<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModelArray GUI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --nav-bg: #1a1a2e;
      --term-bg: #1e1e1e;
      --term-fg: #d4d4d4;
      --step0: #6610f2;
      --step1: #0d6efd;
      --step2: #0dcaf0;
      --step3: #198754;
    }
    body { background: #f0f2f5; padding-bottom: 48px; }
    .navbar { background: var(--nav-bg); }
    .step-card-0 .accordion-button { border-left: 4px solid var(--step0); }
    .step-card-1 .accordion-button { border-left: 4px solid var(--step1); }
    .step-card-2 .accordion-button { border-left: 4px solid var(--step2); }
    .step-card-3 .accordion-button { border-left: 4px solid var(--step3); }
    .step-card-0 .accordion-button:not(.collapsed) { background: #f3eeff; }
    .step-card-1 .accordion-button:not(.collapsed) { background: #e8f0ff; }
    .step-card-2 .accordion-button:not(.collapsed) { background: #e0f8ff; }
    .step-card-3 .accordion-button:not(.collapsed) { background: #e6f9ee; }
    #json-editor {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 12.5px; line-height: 1.5;
      min-height: 420px; resize: vertical;
    }
    #terminal {
      background: var(--term-bg); color: var(--term-fg);
      font-family: 'Courier New', Consolas, monospace;
      font-size: 12.5px; line-height: 1.55;
      height: 360px; overflow-y: auto;
      padding: 10px 14px; border-radius: 6px;
      white-space: pre-wrap; word-break: break-all;
    }
    #terminal:empty::before {
      content: "Ready — run a pipeline step to see output here.";
      color: #666;
    }
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 1050; background: #111827; padding: 6px 16px;
    }
    .card { box-shadow: 0 1px 6px rgba(0,0,0,.10); }
    .form-label { font-size: .82rem; margin-bottom: 3px; }
    .input-group-text { font-size: .82rem; }

    /* File picker modal */
    #picker-items { max-height: 420px; overflow-y: auto; }
    .picker-item {
      cursor: pointer; padding: 5px 10px; border-radius: 4px;
      display: flex; align-items: center; gap: 8px;
      font-size: .85rem; user-select: none;
    }
    .picker-item:hover { background: #e9ecef; }
    .picker-item.selected { background: #cfe2ff; }
    .picker-dir  { color: #0d6efd; font-weight: 500; }
    .picker-file { color: #212529; }
    #picker-path {
      font-family: monospace; font-size: .8rem;
      background: #f8f9fa; padding: 4px 8px;
      border-radius: 4px; word-break: break-all;
    }
    .btn-browse { flex-shrink: 0; }

    /* Step 3 formula builder */
    .font-monospace { font-family: 'Courier New', Consolas, monospace !important; }
    .btn-xs { padding: 2px 8px; font-size: .75rem; line-height: 1.5; border-radius: 4px; }
    .s3-var-chip { cursor: grab; transition: opacity .12s, transform .1s; user-select: none; }
    .s3-var-chip:hover { opacity: .8; transform: scale(1.07); }
    .s3-var-chip:active { cursor: grabbing; }
    #s3-formula {
      font-family: 'Courier New', Consolas, monospace;
      font-size: .9rem;
      min-height: 60px;
    }
  </style>
</head>
<body>

<!-- File Picker Modal -->
<div class="modal fade" id="pickerModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title mb-0"><i class="bi bi-folder2-open me-2"></i><span id="picker-title">Browse</span></h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-2">
        <div id="picker-path" class="mb-2">—</div>
        <div class="input-group input-group-sm mb-2">
          <span class="input-group-text"><i class="bi bi-keyboard"></i></span>
          <input id="picker-jump" type="text" class="form-control"
                 placeholder="Type a path and press Enter to jump there">
          <button class="btn btn-outline-secondary" onclick="pickerJump()">Go</button>
          <button class="btn btn-outline-success" id="picker-mkdir-btn" onclick="pickerMkdir()" title="Create new folder here">
            <i class="bi bi-folder-plus"></i> New folder
          </button>
        </div>
        <div id="picker-items" class="border rounded"></div>
      </div>
      <div class="modal-footer py-2 d-flex justify-content-between">
        <small class="text-muted" id="picker-selected-label">Nothing selected</small>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-sm btn-primary" id="picker-select-btn" onclick="pickerConfirm()" disabled>
            <i class="bi bi-check-lg"></i> Select
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-dark py-2 mb-3">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-grid-3x3-gap-fill me-2"></i>ModelArray GUI
    </span>
    <button class="btn btn-sm btn-outline-danger ms-auto" onclick="confirmShutdown()">
      <i class="bi bi-power"></i> Quit
    </button>
  </div>
</nav>

<!-- Main -->
<div class="container-fluid px-3">

  <!-- Project -->
  <div class="card mb-3">
    <div class="card-header py-2 d-flex align-items-center justify-content-between">
      <span><i class="bi bi-folder-symlink-fill me-1"></i> Project</span>
      <div class="d-flex align-items-center gap-2">
        <select id="proj-file-select" class="form-select form-select-sm"
                style="min-width:180px;max-width:280px"
                title="Saved projects">
          <option value="">— saved projects —</option>
        </select>
        <button class="btn btn-xs btn-outline-primary" onclick="loadProject()"
                title="Load selected project">
          <i class="bi bi-folder2-open"></i> Load
        </button>
        <button class="btn btn-xs btn-success" onclick="saveProject()"
                title="Save current settings as a project">
          <i class="bi bi-floppy"></i> Save
        </button>
      </div>
    </div>
    <div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Project name</label>
          <input id="proj-name" type="text" class="form-control form-control-sm"
                 placeholder="e.g. NODDI_cohort_2026">
        </div>
        <div class="col-md-5">
          <label class="form-label">Description <small class="text-muted">optional</small></label>
          <input id="proj-desc" type="text" class="form-control form-control-sm"
                 placeholder="Short description of the analysis">
        </div>
        <div class="col-md-4">
          <label class="form-label">Project folder
            <small class="text-muted">output root — shared across steps</small></label>
          <div class="input-group input-group-sm">
            <input id="proj-output-dir" type="text" class="form-control"
                   placeholder="/data/local/.../derivatives/modelarray/myproject"
                   oninput="schedPropagateDir()">
            <button class="btn btn-outline-secondary btn-browse"
                    onclick="openPicker('proj-output-dir','dir','Project folder')">
              <i class="bi bi-folder2"></i>
            </button>
          </div>
        </div>
        <div class="col-12 border-top pt-2 mt-1">
          <button class="btn btn-xs btn-outline-secondary" type="button"
                  data-bs-toggle="collapse" data-bs-target="#proj-json-panel">
            <i class="bi bi-braces me-1"></i>Advanced: load / export JSON config
          </button>
          <div class="collapse mt-2" id="proj-json-panel">
            <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
              <select id="proj-config-select" class="form-select form-select-sm"
                      onchange="onConfigSelectChange()" style="min-width:200px;max-width:340px">
                <option value="">— select saved config —</option>
              </select>
              <button class="btn btn-xs btn-outline-primary" onclick="loadConfig()">
                <i class="bi bi-folder2-open"></i> Load into Step 3
              </button>
              <button class="btn btn-xs btn-warning" onclick="newConfig()">
                <i class="bi bi-file-earmark-plus"></i> Template
              </button>
              <span id="config-filename" class="badge bg-secondary text-truncate ms-auto"
                    style="max-width:220px">no config loaded</span>
            </div>
            <textarea id="json-editor" class="form-control form-control-sm font-monospace"
                      rows="8" spellcheck="false"
                      placeholder='{"model_type":"gam","formula":"icvf_dwimap ~ ...","scaler_type":"icvf_dwimap",...}'></textarea>
            <div class="d-flex justify-content-between align-items-center mt-1">
              <small id="json-status" class="text-muted">—</small>
              <div class="d-flex gap-2">
                <button class="btn btn-xs btn-outline-secondary" onclick="validateJson()">
                  <i class="bi bi-check2-circle"></i> Validate
                </button>
                <button class="btn btn-xs btn-outline-secondary" onclick="formatJson()">
                  <i class="bi bi-indent"></i> Format
                </button>
                <button class="btn btn-xs btn-success" onclick="saveConfig()">
                  <i class="bi bi-floppy"></i> Save
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex flex-column gap-3">

      <div class="accordion" id="stepsAccordion">

        <!-- Step 0 -->
        <div class="accordion-item step-card-0">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed py-2" type="button"
                    data-bs-toggle="collapse" data-bs-target="#step0">
              <span class="badge me-2" style="background:var(--step0)">0</span>
              Register ACPC to MNI
            </button>
          </h2>
          <div id="step0" class="accordion-collapse collapse">
            <div class="accordion-body py-2">
              <div class="row g-2">
                <div class="col-12">
                  <label class="form-label">Input directory <span class="text-danger">*</span></label>
                  <div class="input-group input-group-sm">
                    <input id="s0-input-dir" type="text" class="form-control"
                           placeholder="/data/local/.../qsirecon-NODDI">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s0-input-dir','dir','Input directory')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">MNI output directory
                    <small class="text-muted">where registered NIfTI maps are written — leave blank to write alongside inputs</small></label>
                  <div class="input-group input-group-sm">
                    <input id="s0-output-dir" type="text" class="form-control"
                           placeholder="/data/local/.../qsirecon-NODDI_MNI">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s0-output-dir','dir','MNI output directory')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">QSIPrep directory <span class="text-danger">*</span>
                    <small class="text-muted">contains per-subject ACPC→MNI transforms</small></label>
                  <div class="input-group input-group-sm">
                    <input id="s0-qsiprep-dir" type="text" class="form-control"
                           placeholder="/data/local/.../derivatives/qsiprep">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s0-qsiprep-dir','dir','QSIPrep directory')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">ModelArray symlink tree
                    <small class="text-muted">creates one sub-folder per scalar with flat symlinks, used as input by Step 1 — leave blank to skip</small></label>
                  <div class="input-group input-group-sm">
                    <input id="s0-modelarray-dir" type="text" class="form-control"
                           placeholder="/data/local/.../derivatives/modelarray/noddi">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s0-modelarray-dir','dir','ModelArray symlink tree')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Resolution</label>
                  <input id="s0-resolution" type="text" class="form-control form-control-sm"
                         value="02" placeholder="01/02/03">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Parallel jobs</label>
                  <input id="s0-jobs" type="number" class="form-control form-control-sm"
                         value="4" min="1" max="32">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Interpolation</label>
                  <select id="s0-interpolation" class="form-select form-select-sm">
                    <option>Linear</option>
                    <option>NearestNeighbor</option>
                    <option>BSpline</option>
                    <option>LanczosWindowedSinc</option>
                  </select>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="s0-force" type="checkbox" class="form-check-input">
                    <label class="form-check-label form-label" for="s0-force">Force overwrite</label>
                  </div>
                </div>
              </div>
              <div class="d-flex justify-content-end mt-2">
                <button class="btn btn-sm px-3" style="background:var(--step0);color:#fff"
                        onclick="runStep('0')">
                  <i class="bi bi-play-fill"></i> Run Step 0
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 1 -->
        <div class="accordion-item step-card-1">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed py-2" type="button"
                    data-bs-toggle="collapse" data-bs-target="#step1">
              <span class="badge bg-primary me-2">1</span>
              Generate Cohort CSV
            </button>
          </h2>
          <div id="step1" class="accordion-collapse collapse">
            <div class="accordion-body py-2">
              <div class="form-check mb-2">
                <input id="s1-longitudinal" type="checkbox" class="form-check-input">
                <label class="form-check-label form-label" for="s1-longitudinal">
                  Longitudinal mode <small class="text-muted">(multi-session TSV)</small>
                </label>
              </div>
              <div class="row g-2">
                <div class="col-12">
                  <label class="form-label">Participants TSV <span class="text-danger">*</span></label>
                  <div class="input-group input-group-sm">
                    <input id="s1-participants" type="text" class="form-control"
                           placeholder="/data/local/.../participants_longitudinal.tsv">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse for TSV"
                            onclick="openPicker('s1-participants','file','Participants TSV',['.tsv'])">
                      <i class="bi bi-file-earmark-text"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">NIfTI scalar folder <span class="text-danger">*</span>
                    <small class="text-muted">folder of MNI-registered NIfTI maps for one scalar (e.g. modelarray/noddi/icvf_dwimap)</small></label>
                  <div class="input-group input-group-sm">
                    <input id="s1-nii-folder" type="text" class="form-control"
                           placeholder="/data/local/.../modelarray/noddi/icvf_dwimap">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s1-nii-folder','dir','NIfTI scalar folder')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Mask folder <span class="text-danger">*</span>
                    <small class="text-muted">folder containing existing per-subject brain / WM mask NIfTI files (masks are <strong>read</strong>, not written here)</small></label>
                  <div class="input-group input-group-sm">
                    <input id="s1-mask-folder" type="text" class="form-control"
                           placeholder="/data/local/.../modelarray/noddi/masks">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s1-mask-folder','dir','Mask folder')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Output folder <span class="text-danger">*</span>
                    <small class="text-muted">where cohort CSV will be written (e.g. modelarray/noddi — same level as scalar sub-folders)</small></label>
                  <div class="input-group input-group-sm">
                    <input id="s1-output-folder" type="text" class="form-control"
                           placeholder="/data/local/.../derivatives/modelarray/noddi">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s1-output-folder','dir','Output folder')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Subgroup filter
                    <small class="text-muted">column:value e.g. group:1</small></label>
                  <input id="s1-subgroup" type="text" class="form-control form-control-sm"
                         placeholder="group:control">
                </div>
              </div>
              <div class="d-flex justify-content-end mt-2">
                <button class="btn btn-primary btn-sm px-3" onclick="runStep('1')">
                  <i class="bi bi-play-fill"></i> Run Step 1
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="accordion-item step-card-2">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed py-2" type="button"
                    data-bs-toggle="collapse" data-bs-target="#step2">
              <span class="badge bg-info me-2">2</span>
              Run Convoxel → HDF5
            </button>
          </h2>
          <div id="step2" class="accordion-collapse collapse">
            <div class="accordion-body py-2">
              <div class="row g-2">
                <div class="col-12">
                  <label class="form-label">Cohort CSV <span class="text-danger">*</span></label>
                  <div class="input-group input-group-sm">
                    <input id="s2-cohort" type="text" class="form-control"
                           placeholder="/data/local/.../modelarray/noddi/cohort_icvf_dwimap.csv">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse for CSV"
                            onclick="openPicker('s2-cohort','file','Cohort CSV',['.csv'])">
                      <i class="bi bi-file-earmark-text"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label">Root directory <span class="text-danger">*</span></label>
                  <div class="input-group input-group-sm">
                    <input id="s2-root" type="text" class="form-control"
                           placeholder="/data/local/.../modelarray/noddi">
                    <button class="btn btn-outline-secondary btn-browse"
                            title="Browse"
                            onclick="openPicker('s2-root','dir','Root directory')">
                      <i class="bi bi-folder2"></i>
                    </button>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="s2-debug" type="checkbox" class="form-check-input">
                    <label class="form-check-label form-label" for="s2-debug">Debug output</label>
                  </div>
                </div>
              </div>
              <div class="d-flex justify-content-end mt-2">
                <button class="btn btn-sm px-3" style="background:var(--step2);color:#000"
                        onclick="runStep('2')">
                  <i class="bi bi-play-fill"></i> Run Step 2
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="accordion-item step-card-3">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed py-2" type="button"
                    data-bs-toggle="collapse" data-bs-target="#step3">
              <span class="badge bg-success me-2">3</span>
              Statistics — Model Analysis
            </button>
          </h2>
          <div id="step3" class="accordion-collapse collapse">
            <div class="accordion-body py-2">

              <!-- Model type + Outcome + Analysis name -->
              <div class="row g-2 mb-3">
                <div class="col-md-3">
                  <label class="form-label">Model type <span class="text-danger">*</span></label>
                  <select id="s3-model-type" class="form-select form-select-sm"
                          onchange="updateStep3JsonPreview()">
                    <option value="gam">gam — Generalized Additive Model</option>
                    <option value="lm">lm — Linear Model</option>
                    <option value="lmer">lmer — Linear Mixed Effects</option>
                    <option value="gamm4">gamm4 — Generalized Additive Mixed</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Outcome variable (scaler) <span class="text-danger">*</span>
                    <small class="text-muted">left-hand side of formula</small></label>
                  <input id="s3-scaler" type="text" class="form-control form-control-sm"
                         placeholder="e.g. icvf_dwimap" value="icvf_dwimap"
                         oninput="updateStep3JsonPreview()">
                </div>
                <div class="col-md-5">
                  <label class="form-label">Analysis name
                    <small class="text-muted">used for output folder &amp; summary file</small></label>
                  <input id="s3-analysis-name" type="text" class="form-control form-control-sm"
                         placeholder="e.g. icvf_gam_group_trajectory"
                         oninput="updateStep3JsonPreview()">
                </div>
              </div>

              <!-- Formula builder card -->
              <div class="card border-primary mb-3">
                <div class="card-header py-2 d-flex justify-content-between align-items-center"
                     style="background:rgba(13,110,253,.07);border-color:rgba(13,110,253,.3)">
                  <span class="fw-semibold"><i class="bi bi-function me-1"></i>Formula Builder</span>
                  <button class="btn btn-xs btn-outline-secondary" type="button"
                          onclick="setDemoFormula()">
                    <i class="bi bi-magic me-1"></i>Load demo
                  </button>
                </div>
                <div class="card-body py-2">
                  <!-- Available variables -->
                  <div class="d-flex align-items-center justify-content-between mb-1">
                    <label class="form-label mb-0 fw-semibold">Available variables
                      <small class="text-muted fw-normal">— drag or click a chip to insert into the formula below</small>
                    </label>
                    <button class="btn btn-xs btn-outline-secondary" type="button"
                            onclick="loadVariablesFromTSV()">
                      <i class="bi bi-arrow-clockwise me-1"></i>Load from TSV
                    </button>
                  </div>
                  <div id="s3-variables"
                       class="d-flex flex-wrap gap-1 p-2 rounded border bg-white mb-3"
                       style="min-height:38px">
                    <span id="s3-vars-placeholder" class="text-muted" style="font-size:.8rem">
                      No variables loaded — fill in the Participants TSV path in Step 1 and click <strong>Load from TSV</strong>
                    </span>
                  </div>
                  <!-- Formula textarea -->
                  <label class="form-label fw-semibold mb-1">Formula <span class="text-danger">*</span>

<script>
"use strict";

// ─── State ────────────────────────────────────────────────────────────────────
let currentConfigName = null;
let logPos = 0;
let pollTimer = null;

// ─── Startup ──────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  loadConfigList();
  loadProjectList();
  loadLogList();
  startStatusPolling();
  document.getElementById("picker-jump").addEventListener("keydown", e => {
    if (e.key === "Enter") pickerJump();
  });
  let debounce = null;
  document.getElementById("json-editor").addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(validateJson, 900);
  });
});

// ─── Project save / load ──────────────────────────────────────────────────────
/** All field IDs whose values make up a project snapshot */
const PROJECT_FIELDS = [
  // Project card
  "proj-name", "proj-desc", "proj-output-dir",
  // Step 0
  "s0-input-dir", "s0-output-dir", "s0-qsiprep-dir", "s0-modelarray-dir",
  "s0-resolution", "s0-jobs", "s0-interpolation",
  // Step 1
  "s1-participants", "s1-nii-folder", "s1-mask-folder",
  "s1-output-folder", "s1-subgroup",
  // Step 2
  "s2-cohort", "s2-root",
  // Step 3
  "s3-model-type", "s3-scaler", "s3-analysis-name", "s3-formula",
  "s3-cat-vars", "s3-cont-vars",
  "s3-h5-file", "s3-output-dir", "s3-mask-file",
  "s3-cores", "s3-lthr-abs", "s3-lthr-rel"
];

const PROJECT_CHECKBOXES = [
  "s0-force", "s1-longitudinal", "s2-debug", "s3-full-outputs", "s3-test"
];

function collectState() {
  const state = { fields: {}, checkboxes: {} };
  PROJECT_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) state.fields[id] = el.value;
  });
  PROJECT_CHECKBOXES.forEach(id => {
    const el = document.getElementById(id);
    if (el) state.checkboxes[id] = el.checked;
  });
  return state;
}

function restoreState(state) {
  if (!state) return;
  (Object.entries(state.fields || {})).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  });
  (Object.entries(state.checkboxes || {})).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.checked = val;
  });
  // Re-run any derived UI updates
  schedPropagateDir();
  updateStep3JsonPreview();
}

async function loadProjectList() {
  try {
    const r = await fetch("/list_projects");
    const d = await r.json();
    const sel = document.getElementById("proj-file-select");
    const cur = sel.value;
    sel.innerHTML = '<option value="">— saved projects —</option>';
    (d.projects || []).forEach(n => {
      sel.innerHTML += `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}</option>`;
    });
  } catch {}
}

async function saveProject() {
  const name = (v("proj-name") || "").trim() ||
               prompt("Project name (used as filename):", "my_project");
  if (!name) return;
  const clean = name.replace(/[\s/\\]+/g, "_");
  try {
    const r = await fetch("/save_project", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: clean, state: collectState() })
    });
    const d = await r.json();
    if (d.error) { showToast("Error: " + d.error, "danger"); return; }
    showToast(d.message, "success");
    await loadProjectList();
    document.getElementById("proj-file-select").value = clean;
  } catch(e) { showToast("Save error: " + e, "danger"); }
}

async function loadProject() {
  const name = document.getElementById("proj-file-select").value;
  if (!name) { showToast("Select a project to load.", "warning"); return; }
  try {
    const r = await fetch("/load_project?name=" + encodeURIComponent(name));
    const d = await r.json();
    if (d.error) { showToast("Error: " + d.error, "danger"); return; }
    restoreState(d.state);
    showToast("Project '" + name + "' loaded.", "success");
    setStatus("Project loaded: " + name, "ok");
  } catch(e) { showToast("Load error: " + e, "danger"); }
}


  if (!name || !name.trim()) return;
  try {
    const r = await fetch("/mkdir", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parent: _pickerCurPath, name: name.trim() })
    });
    const d = await r.json();
    if (d.error) { showToast("Error: " + d.error, "danger"); return; }
    // Navigate into the new folder and select it
    await pickerLoad(d.path);
    pickerSelect(d.path);
  } catch(e) { showToast("Network error: " + e, "danger"); }
}

let _pickerTarget   = null;
let _pickerMode     = "dir";
let _pickerExts     = [];
let _pickerCurPath  = "/";
let _pickerSelected = null;

function openPicker(targetId, mode, title, exts) {
  mode  = mode  || "dir";
  title = title || "Browse";
  exts  = exts  || [];
  _pickerTarget   = targetId;
  _pickerMode     = mode;
  _pickerExts     = exts;
  _pickerSelected = null;

  document.getElementById("picker-title").textContent = title;
  document.getElementById("picker-select-btn").disabled = true;
  document.getElementById("picker-selected-label").textContent = "Nothing selected";

  const cur = ((document.getElementById(targetId) || {}).value || "").trim();
  const startPath = cur || "/data/local";
  document.getElementById("picker-jump").value = startPath;

  pickerLoad(startPath);
  bootstrap.Modal.getOrCreateInstance(document.getElementById("pickerModal")).show();
}

async function pickerLoad(path) {
  try {
    const r = await fetch("/browse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: path, mode: _pickerMode, extensions: _pickerExts })
    });
    const d = await r.json();
    if (d.error) { showToast("Browse error: " + d.error, "danger"); return; }

    _pickerCurPath = d.current;
    document.getElementById("picker-path").textContent = d.current;
    document.getElementById("picker-jump").value = d.current;

    const container = document.getElementById("picker-items");
    container.innerHTML = "";

    // In dir mode: offer "Select this folder" at the top
    if (_pickerMode === "dir") {
      const selSelf = document.createElement("div");
      selSelf.className = "picker-item picker-dir fw-semibold border-bottom mb-1";
      selSelf.innerHTML = '<i class="bi bi-folder-fill text-warning"></i> <em>Select this folder</em>';
      selSelf.onclick = function() { pickerSelect(d.current); };
      container.appendChild(selSelf);
    }

    d.items.forEach(function(item) {
      const el = document.createElement("div");
      el.className = "picker-item " + (item.is_dir ? "picker-dir" : "picker-file");

      let icon, iconColor;
      if (item.name === "..") {
        icon = "bi-arrow-up-circle"; iconColor = "text-secondary";
      } else if (item.is_dir) {
        icon = "bi-folder-fill"; iconColor = "text-warning";
      } else {
        icon = "bi-file-earmark"; iconColor = "text-muted";
      }
      el.innerHTML = '<i class="bi ' + icon + ' ' + iconColor + '"></i> ' + esc(item.name);

      el.onclick = function() {
        if (item.is_dir) {
          if (_pickerMode === "dir" && item.name !== "..") {
            pickerSelect(item.path);
          }
          pickerLoad(item.path);
        } else {
          container.querySelectorAll(".picker-item").forEach(function(e) {
            e.classList.remove("selected");
          });
          el.classList.add("selected");
          pickerSelect(item.path);
        }
      };
      container.appendChild(el);
    });
  } catch(e) { showToast("Network error: " + e, "danger"); }
}

function pickerSelect(path) {
  _pickerSelected = path;
  document.getElementById("picker-selected-label").textContent = path;
  document.getElementById("picker-select-btn").disabled = false;
}

function pickerJump() {
  const path = document.getElementById("picker-jump").value.trim();
  if (path) pickerLoad(path);
}

function pickerConfirm() {
  if (!_pickerSelected) return;
  const el = document.getElementById(_pickerTarget);
  if (el) el.value = _pickerSelected;
  bootstrap.Modal.getOrCreateInstance(document.getElementById("pickerModal")).hide();
  if (_pickerTarget === "proj-output-dir") propagateProjectDir();
}

// ─── Project output dir propagation ──────────────────────────────────────────
let _propTimer = null;
function schedPropagateDir() {
  clearTimeout(_propTimer);
  _propTimer = setTimeout(propagateProjectDir, 700);
}
function propagateProjectDir() {
  const d = v("proj-output-dir");
  if (!d) return;
  ["s0-modelarray-dir", "s1-output-folder", "s2-root"].forEach(function(id) {
    const el = document.getElementById(id);
    if (el && !el.value.trim()) el.value = d;
  });
}

// ─── Config helpers ───────────────────────────────────────────────────────────
async function loadConfigList() {
  try {
    const r = await fetch("/list_configs");
    const d = await r.json();
    const configs = d.configs || [];
    ["proj-config-select"].forEach(function(selId) {
      const el = document.getElementById(selId);
      const cur = el.value;
      el.innerHTML = '<option value="">— select saved config —</option>';
      configs.forEach(function(n) {
        el.innerHTML += '<option value="' + esc(n) + '"' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>';
      });
    });
  } catch {}
}

function onConfigSelectChange() {
  // Just keep the select value; Load button triggers the actual load
}

async function loadConfig() {
  const name = document.getElementById("proj-config-select").value;
  if (!name) { showToast("Select a config file first.", "warning"); return; }
  try {
    const r = await fetch("/get_config?name=" + encodeURIComponent(name));
    const d = await r.json();
    if (d.error) { showToast("Error: " + d.error, "danger"); return; }
    document.getElementById("json-editor").value = JSON.stringify(d.content, null, 2);
    document.getElementById("config-filename").textContent = name;
    currentConfigName = name;
    document.getElementById("proj-config-select").value = name;
    validateJson();
    autoFillSteps(d.content);
    setStatus("Loaded: " + name, "ok");
  } catch(e) { showToast("Fetch error: " + e, "danger"); }
}

async function saveConfig() {
  const editor = document.getElementById("json-editor");
  let content;
  try { content = JSON.parse(editor.value); }
  catch(e) { showToast("JSON invalid — fix first: " + e.message, "danger"); return; }
  const name = currentConfigName || prompt("Save as (in configs/):", "config.json");
  if (!name) return;
  try {
    const r = await fetch("/save_config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, content: content })
    });
    const d = await r.json();
    if (d.error) { showToast("Error: " + d.error, "danger"); return; }
    currentConfigName = d.name;
    document.getElementById("config-filename").textContent = d.name;
    showToast(d.message, "success");
    loadConfigList();
  } catch(e) { showToast("Save error: " + e, "danger"); }
}

function newConfig() {
  const tmpl = {
    "_comment": "ModelArray analysis config",
    "container": "/data/local/container/modelarray/modelarray_confixel_0.1.5.sif",
    "data_dir": "",
    "h5_file": "cohort_icvf_dwimap.h5",
    "csv_file": "cohort_icvf_dwimap.csv",
    "group_mask_file": "group_mask.nii.gz",
    "output_dir": "results/icvf_gam",
    "output_ext": ".nii.gz",
    "csv_summary_path": "results/icvf_gam/summary.csv",
    "model_type": "gam",
    "scaler_type": "icvf_dwimap",
    "formula": "icvf_dwimap ~ s(delta_age, by=group, k=3) + group + participant + sex",
    "continuous_covariates": [],
    "categorical_variables": ["group", "participant", "sex"],
    "num_subj_lthr_abs": 10, "num_subj_lthr_rel": 0.1,
    "full_outputs": true, "n_cores": 4, "analysis_name": "icvf_gam"
  };

function autoFillSteps(cfg) {
  if (!cfg) return;
  const d = cfg.data_dir || "";
  const c = cfg.csv_file || "";
  if (d && !document.getElementById("s2-root").value)
    document.getElementById("s2-root").value = d;
  if (d && c && !document.getElementById("s2-cohort").value)
    document.getElementById("s2-cohort").value = d + "/" + c;

  // Populate Step 3 form fields from loaded config
  if (cfg.formula)      document.getElementById("s3-formula").value = cfg.formula;
  if (cfg.model_type)   document.getElementById("s3-model-type").value = cfg.model_type;
  if (cfg.scaler_type)  document.getElementById("s3-scaler").value = cfg.scaler_type;
  if (cfg.analysis_name) document.getElementById("s3-analysis-name").value = cfg.analysis_name;
  if (cfg.categorical_variables)
    document.getElementById("s3-cat-vars").value = (cfg.categorical_variables || []).join(", ");
  if (cfg.continuous_covariates)
    document.getElementById("s3-cont-vars").value = (cfg.continuous_covariates || []).join(", ");
  if (d && cfg.h5_file && !document.getElementById("s3-h5-file").value)
    document.getElementById("s3-h5-file").value = d + "/" + cfg.h5_file;
  if (cfg.output_dir) {
    const fullOut = cfg.output_dir.startsWith("/") ? cfg.output_dir : (d + "/" + cfg.output_dir);
    document.getElementById("s3-output-dir").value = fullOut;
  }
  if (cfg.group_mask_file) {
    const fullMask = cfg.group_mask_file.startsWith("/")
      ? cfg.group_mask_file : (d + "/" + cfg.group_mask_file);
    document.getElementById("s3-mask-file").value = fullMask;
  }
  if (cfg.n_cores)           document.getElementById("s3-cores").value = cfg.n_cores;
  if (cfg.num_subj_lthr_abs) document.getElementById("s3-lthr-abs").value = cfg.num_subj_lthr_abs;
  if (cfg.num_subj_lthr_rel) document.getElementById("s3-lthr-rel").value = cfg.num_subj_lthr_rel;
  if (cfg.full_outputs != null) document.getElementById("s3-full-outputs").checked = cfg.full_outputs;
  updateStep3JsonPreview();
}

// ─── JSON editor ──────────────────────────────────────────────────────────────
function validateJson() {
  const el = document.getElementById("json-editor");
  const st = document.getElementById("json-status");
  if (!el.value.trim()) { st.textContent = "—"; st.className = "text-muted"; return true; }
  try { JSON.parse(el.value); st.textContent = "✓ Valid JSON"; st.className = "text-success"; return true; }
  catch(e) { st.textContent = "✗ " + e.message; st.className = "text-danger"; return false; }
}

function formatJson() {
  const el = document.getElementById("json-editor");
  try { el.value = JSON.stringify(JSON.parse(el.value), null, 2); validateJson(); }
  catch { showToast("Cannot format — JSON invalid.", "warning"); }
}

// ─── Step 3: Statistics / Formula builder ─────────────────────────────────────
let _s3vars = [];

async function loadVariablesFromTSV() {
  const tsv = v("s1-participants");
  if (!tsv) { showToast("Enter Participants TSV path in Step 1 first.", "warning"); return; }
  try {
    const r = await fetch("/parse_tsv", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: tsv })
    });
    const d = await r.json();
    if (d.error) { showToast("Error: " + d.error, "danger"); return; }
    renderVariableChips(d.columns || []);
    showToast("Loaded " + (d.columns || []).length + " variables from TSV.", "success");
  } catch(e) { showToast("Network error: " + e, "danger"); }
}

function renderVariableChips(columns) {
  _s3vars = columns;
  const container = document.getElementById("s3-variables");
  if (!columns.length) {
    container.innerHTML =
      '<span id="s3-vars-placeholder" class="text-muted" style="font-size:.8rem">' +
      'No variables loaded</span>';
    return;
  }
  container.innerHTML = "";
  columns.forEach(function(col) {
    const chip = document.createElement("span");
    chip.className = "badge bg-primary rounded-pill px-2 py-1 s3-var-chip";
    chip.textContent = col;
    chip.draggable = true;
    chip.title = "Click to append \u00b7 drag into formula";
    chip.dataset.varname = col;
    chip.addEventListener("dragstart", function(e) {
      e.dataTransfer.setData("text/plain", col);
    });
    chip.addEventListener("click", function() {
      const ta = document.getElementById("s3-formula");
      const cur = ta.value.trim();
      ta.value = cur ? cur + " + " + col : col;
      ta.focus();
      updateStep3JsonPreview();
    });
    container.appendChild(chip);
  });
}

function dropVarIntoFormula(event) {
  event.preventDefault();
  const varName = event.dataTransfer.getData("text/plain");
  if (!varName) return;
  const ta = document.getElementById("s3-formula");
  const pos = (ta.selectionStart != null) ? ta.selectionStart : ta.value.length;
  ta.value = ta.value.slice(0, pos) + varName + ta.value.slice(pos);
  ta.selectionStart = ta.selectionEnd = pos + varName.length;
  ta.focus();
  updateStep3JsonPreview();
}

function setDemoFormula() {
  const scaler = v("s3-scaler") || "icvf_dwimap";
  document.getElementById("s3-formula").value =
    scaler + " ~ s(delta_age, by=group, k=3) + group + participant + sex";
  if (!v("s3-cat-vars"))
    document.getElementById("s3-cat-vars").value = "group, participant, sex";
  updateStep3JsonPreview();
}

function buildStep3Config() {
  const h5Path  = v("s3-h5-file");
  const dataDir = h5Path
    ? h5Path.substring(0, h5Path.lastIndexOf("/"))
    : (v("proj-output-dir") || "");
  const h5file  = h5Path ? h5Path.split("/").pop() : "cohort_icvf_dwimap.h5";
  const csvFile = h5file.replace(/\.h5$/i, ".csv");

  const scaler      = v("s3-scaler") || "icvf_dwimap";
  const modelType   = document.getElementById("s3-model-type").value || "gam";
  const formula     = v("s3-formula") || "";
  const analysisName = v("s3-analysis-name") || (scaler + "_" + modelType);

  const catVars  = v("s3-cat-vars")
    ? v("s3-cat-vars").split(",").map(x => x.trim()).filter(Boolean) : [];
  const contVars = v("s3-cont-vars")
    ? v("s3-cont-vars").split(",").map(x => x.trim()).filter(Boolean) : [];

  const outputDir = v("s3-output-dir") || (dataDir + "/results/" + analysisName);
  const maskPath  = v("s3-mask-file")  || (dataDir + "/group_mask.nii.gz");

  return {
    "_comment":   "ModelArray config \u2014 auto-generated by GUI",
    "analysis_name": analysisName,
    "container":  "/data/local/container/modelarray/modelarray_confixel_0.1.5.sif",
    "data_dir":   dataDir,
    "h5_file":    h5file,
    "csv_file":   csvFile,
    "group_mask_file": maskPath,
    "output_dir": outputDir,
    "output_ext": ".nii.gz",
    "csv_summary_path": outputDir + "/summary_" + analysisName + ".csv",
    "model_type": modelType,
    "scaler_type": scaler,
    "formula":    formula,
    "continuous_covariates":  contVars,
    "categorical_variables":  catVars,
    "num_subj_lthr_abs": parseInt(v("s3-lthr-abs"))  || 10,
    "num_subj_lthr_rel": parseFloat(v("s3-lthr-rel")) || 0.1,
    "full_outputs": document.getElementById("s3-full-outputs").checked,
    "n_cores": parseInt(v("s3-cores")) || 4
  };
}

function updateStep3JsonPreview() {
  const el = document.getElementById("s3-json-text");
  if (el) {
    try { el.value = JSON.stringify(buildStep3Config(), null, 2); } catch {}
  }
}

// ─── Pipeline ─────────────────────────────────────────────────────────────────
async function runStep(step) {
  let args = {};
  if (step === "0") {
    args = {
      input_dir:      v("s0-input-dir"),
      output_dir:     v("s0-output-dir"),
      qsiprep_dir:    v("s0-qsiprep-dir"),
      modelarray_dir: v("s0-modelarray-dir"),
      resolution:     v("s0-resolution"),
      jobs:           v("s0-jobs"),
      interpolation:  v("s0-interpolation"),
      force:          document.getElementById("s0-force").checked
    };
    if (!args.input_dir) { showToast("Input directory is required.", "danger"); return; }
    if (!args.qsiprep_dir) { showToast("QSIPrep directory is required for Step 0.", "danger"); return; }
  } else if (step === "1") {
    args = {
      longitudinal:  document.getElementById("s1-longitudinal").checked,
      participants:  v("s1-participants"),
      nii_folder:    v("s1-nii-folder"),
      mask_folder:   v("s1-mask-folder"),
      output_folder: v("s1-output-folder"),
      subgroup:      v("s1-subgroup")
    };
    if (!args.participants || !args.nii_folder || !args.mask_folder || !args.output_folder) {
      showToast("Participants, NIfTI folder, mask folder and output folder are required.", "danger"); return;
    }
  } else if (step === "2") {
    args = {
      cohort_file: v("s2-cohort"),
      root_dir:    v("s2-root"),
      debug:       document.getElementById("s2-debug").checked
    };
    if (!args.cohort_file || !args.root_dir) {
      showToast("Cohort CSV and root directory are required.", "danger"); return;
    }
  } else if (step === "3") {
    const cfg = buildStep3Config();
    const formula = (cfg.formula || "").trim();
    if (!formula || !formula.includes("~")) {
      showToast("Enter a valid formula containing ~ (e.g. outcome ~ predictor).", "danger"); return;
    }
    if (!cfg.h5_file || !cfg.data_dir) {
      showToast("HDF5 file path is required.", "danger"); return;
    }
    // Auto-save config then run
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 16);
    const cfgName = (cfg.analysis_name || "config").replace(/[\s/\\]+/g, "_") + "_" + ts + ".json";
    try {
      const saveR = await fetch("/save_config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: cfgName, content: cfg })
      });
      const saveD = await saveR.json();
      if (saveD.error) { showToast("Config save error: " + saveD.error, "danger"); return; }
      args = { config: saveD.name, test: document.getElementById("s3-test").checked };
      showToast("Config saved: " + saveD.name, "info");
      loadConfigList();
    } catch(e) { showToast("Error saving config: " + e, "danger"); return; }
  }

  try {
    const r = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ step: step, args: args })
    });
    const d = await r.json();
    if (d.error) { showToast(d.error, "danger"); return; }
    clearTerminal();
    termWrite("[GUI] Step " + step + " started  —  " + new Date().toLocaleTimeString() + "\n" + "─".repeat(55) + "\n");
    setStatus("Step " + step + " running…", "warn");
    startLogPolling();
    showToast("Step " + step + " started", "success");
  } catch(e) { showToast("Network error: " + e, "danger"); }
}

async function stopJob() {
  try {
    const r = await fetch("/stop", { method: "POST" });
    const d = await r.json();
    showToast(d.message, "info");
  } catch(e) { showToast("Error: " + e, "danger"); }
}

// ─── Terminal ─────────────────────────────────────────────────────────────────
function clearTerminal() { document.getElementById("terminal").textContent = ""; }
function termWrite(t) {
  const el = document.getElementById("terminal");
  el.textContent += t;
  el.scrollTop = el.scrollHeight;
}

function startLogPolling() { stopLogPolling(); logPos = 0; pollTimer = setInterval(pollLog, 400); }
function stopLogPolling() { clearInterval(pollTimer); pollTimer = null; }

async function pollLog() {
  try {
    const r = await fetch("/log_chunk?pos=" + logPos);
    const d = await r.json();
    if (d.chunk) { termWrite(d.chunk); logPos = d.pos; }
    if (d.done) stopLogPolling();
  } catch {}
}

async function loadHistoryLog() {
  const name = document.getElementById("log-select").value;
  if (!name) return;
  stopLogPolling(); clearTerminal(); logPos = 0;
  const read = async function() {
    const r = await fetch("/log_chunk?name=" + encodeURIComponent(name) + "&pos=" + logPos);
    const d = await r.json();
    if (d.chunk) { termWrite(d.chunk); logPos = d.pos; }
    if (!d.done) setTimeout(read, 200);
  };
  read();
}

async function loadLogList() {
  try {
    const r = await fetch("/list_logs");
    const d = await r.json();
    const sel = document.getElementById("log-select");
    const cur = sel.value;
    sel.innerHTML = '<option value="">— history —</option>';
    (d.logs || []).forEach(function(l) {
      sel.innerHTML += '<option value="' + esc(l) + '"' + (l === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
    });
  } catch {}
}

// ─── Status polling ───────────────────────────────────────────────────────────
function startStatusPolling() {
  pollJobStatus();
  setInterval(pollJobStatus, 2000);
  setInterval(loadLogList, 10000);
}

async function pollJobStatus() {
  try {
    const r = await fetch("/job_status");
    const d = await r.json();
    const badge  = document.getElementById("job-badge");
    const stopBtn = document.getElementById("btn-stop");
    if (d.running) {
      badge.className = "badge bg-warning text-dark";
      badge.textContent = "Step " + d.step + " running…";
      stopBtn.disabled = false;
      if (!pollTimer && d.log_file) startLogPolling();
    } else if (d.returncode !== null) {
      const wasRunning = (pollTimer !== null);
      stopLogPolling();
      if (d.returncode === 0) {
        badge.className = "badge bg-success";
        badge.textContent = "Step " + d.step + " ✓";
        setStatus("Step " + d.step + " finished", "ok");
        if (wasRunning) {
          const ts = new Date().toLocaleTimeString();
          termWrite("\n" + "─".repeat(55) + "\n✅  Step " + d.step + " finished successfully  —  " + ts + "\n");
        }
      } else {
        badge.className = "badge bg-danger";
        badge.textContent = "Step " + d.step + " failed (" + d.returncode + ")";
        setStatus("Step " + d.step + " failed", "err");
        if (wasRunning) {
          const ts = new Date().toLocaleTimeString();
          termWrite("\n" + "─".repeat(55) + "\n❌  Step " + d.step + " failed  (exit code " + d.returncode + ")  —  " + ts + "\n");
        }
      }
      stopBtn.disabled = true;
    } else {
      badge.className = "badge bg-secondary";
      badge.textContent = "idle";
      stopBtn.disabled = true;
    }
  } catch {}
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function v(id) { return ((document.getElementById(id) || {}).value || "").trim(); }
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function setStatus(msg, type) {
  const cols = { ok: "#6ee7b7", err: "#fca5a5", warn: "#fde68a" };
  const el = document.getElementById("status-text");
  el.style.color = cols[type] || "#9ca3af";
  el.textContent = msg;
}
function showToast(msg, type) {
  const bg = {
    success: "text-bg-success", danger: "text-bg-danger",
    warning: "text-bg-warning", info: "text-bg-info", secondary: "text-bg-secondary"
  };
  const t = document.getElementById("toast");
  t.className = "toast align-items-center border-0 " + (bg[type] || bg.secondary);
  document.getElementById("toast-body").textContent = msg;
  bootstrap.Toast.getOrCreateInstance(t, { delay: 3500 }).show();
}
async function confirmShutdown() {
  if (!confirm("Quit the ModelArray GUI server?")) return;
  try { await fetch("/shutdown", { method: "POST" }); } catch {}
  document.body.innerHTML =
    '<div class="d-flex justify-content-center align-items-center vh-100">' +
    '<p class="text-muted h5">GUI stopped — you can close this tab.</p></div>';
}
</script>
